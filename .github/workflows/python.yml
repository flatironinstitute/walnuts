name: walnuts python

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch: {}

# only run one copy per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Test (${{matrix.os.name}} / Python ${{matrix.python-version}})
    runs-on: ${{matrix.os.name}}-${{matrix.os.version || 'latest'}}
    strategy:
      fail-fast: false
      matrix:
        os:
            - name: windows
            - name: ubuntu
            - name: macos
              version: 26
            - name: macos
              version: 26-intel

        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out github
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        if: matrix.os.version != '26-intel'
        run: pip install .[test-fast]

      - name: Install package
        run: pip install .[test]

      - name: Test
        run: pytest python/


  build_wheels:
    name: "Build wheels for ${{ matrix.cfg.os }}"
    runs-on: ${{matrix.cfg.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - os: windows-x86_64
            runs-on: windows-latest
          - os: linux-x86_64
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: macos-arm
            runs-on: macos-26
          - os: macos-x86_64
            runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
           CIBW_ENVIRONMENT_MACOS: >
               MACOSX_DEPLOYMENT_TARGET=15

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.cfg.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: "Build source distribution"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Build SDist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
